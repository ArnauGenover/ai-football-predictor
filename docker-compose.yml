services:
  db:
    image: postgres:15
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-football}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-football_secret}
      POSTGRES_DB: ${POSTGRES_DB:-football_analytics}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U football -d football_analytics"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "7860:7860"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "7860", "--reload"]

  
  collector:
    build:
      context: ./collector
      dockerfile: Dockerfile
    env_file:
      - ./collector/.env
    volumes:
      - ./collector:/collector
    profiles:
      - collect

  ml-train:
    build:
      context: ./ml
      dockerfile: Dockerfile
    env_file:
      - ./ml/.env
    volumes:
      - ./ml:/ml
    command: ["python", "train.py"]
    profiles:
      - ml

  ml-predict:
    build:
      context: ./ml
      dockerfile: Dockerfile
    env_file:
      - ./ml/.env
    volumes:
      - ./ml:/ml
    command: ["python", "predict.py"]
    profiles:
      - ml

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:7860
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  pgdata:
