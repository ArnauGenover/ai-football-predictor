name: Football Data Collector

on:
  schedule:
    # Twice daily: 8 AM and 8 PM UTC
    - cron: "0 8,20 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: collector/requirements.txt

      - name: Install dependencies
        run: pip install -r collector/requirements.txt

      - name: Run data collector
        env:
          DATABASE_URL_SYNC: ${{ secrets.DATABASE_URL_SYNC }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_HOST: ${{ secrets.API_FOOTBALL_HOST }}
          TARGET_LEAGUE_IDS: ${{ secrets.TARGET_LEAGUE_IDS }}
          CURRENT_SEASON: ${{ secrets.CURRENT_SEASON }}
          HF_SPACE_URL: ${{ secrets.HF_SPACE_URL }}
        run: python -m collector.main

      - name: Report API usage
        if: always()
        run: echo "Collector run completed at $(date -u)"
